name: prod_build

on:
  push:
    branches:
      - prod-deploy

jobs:
  build:
    runs-on: [self-hosted, Prod]

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Usar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar build
        run: NODE_OPTIONS="--max-old-space-size=1024" npm run build

      - name: Verificar carpeta dist
        run: ls -la dist
      
      - name: Copiar build a Nginx
        run: |
          rm -rf /var/www/html/sied/*
          cp -r dist/* /var/www/html/sied/
